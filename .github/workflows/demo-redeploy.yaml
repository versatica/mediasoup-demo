name: demo-redeploy

# Triggers a redeploy of the demo server (https://v3demo.mediasoup.org) by
# opening an SSH connection to it. No command is sent: the server runs the
# forced command configured in the `deploy` user's authorized_keys
# (the /home/deploy/update-mediasoup-demo-v3.sh script), which pulls the latest
# v3 branch, installs deps, transpiles and restarts the PM2 service.
#
# It runs automatically once the mediasoup-demo-server workflow completes
# successfully for a push to v3, so we never redeploy on a broken build nor on
# pull requests. It is also triggered (via workflow_dispatch) by the
# update-mediasoup workflow right after it commits a mediasoup bump, and can be
# triggered manually from the Actions tab.
on:
  workflow_run:
    workflows: [mediasoup-demo-server]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  redeploy:
    name: Trigger redeploy on the mediasoup-demo application
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Run on a manual/automated dispatch (e.g. from update-mediasoup), or only
    # when the triggering mediasoup-demo-server run succeeded for a push to the
    # v3 branch (not for pull requests).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'v3')

    steps:
      - name: Trigger mediasoup-demo application redeploy via SSH
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" >> "$HOME/.ssh/known_hosts"

          # No command is given on purpose: the server enforces the forced
          # `command="...update-mediasoup-demo-v3.sh"` in authorized_keys, so
          # that script is what actually runs. Its stdout/stderr is streamed
          # back here and shown in the Actions logs.
          ssh -i "$HOME/.ssh/deploy_key" \
              -p "${{ secrets.SSH_PORT }}" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
